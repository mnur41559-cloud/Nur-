<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নূরের সেরা রুটিন</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0B0F19',
                        cardBg: '#111827',
                        neonGreen: '#10B981',
                        neonGold: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-full flex flex-col selection:bg-emerald-500 selection:text-slate-950">

    <!-- Header Section: Logo, Title, Sound & Compact Countdown Badge -->
    <header class="bg-cardBg/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <!-- App Name & Logo -->
            <div class="flex items-center gap-2.5">
                <span class="text-2xl sm:text-3xl">🌙</span>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-neonGold tracking-wide leading-tight">নূরের সেরা রুটিন</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">আপনার দৈনিক সাফল্যের সুশৃঙ্খল গাইড</p>
                </div>
            </div>
            
            <!-- Controls: Sound Toggle & Compact Countdown Badge -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Compact Countdown Badge (No Extra Label, Minimalist Pill Layout) -->
                <div class="flex items-center gap-1.5 bg-slate-900 border border-emerald-500/50 px-3 py-1.5 rounded-full shadow-inner">
                    <span class="text-sm animate-pulse">⏳</span>
                    <span id="cornerCountdown" class="text-xs sm:text-sm font-mono font-bold text-neonGreen tracking-wider">00:00:00</span>
                </div>

                <!-- Sound Toggle Button -->
                <button id="soundToggleBtn" onclick="toggleSound()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-700 transition shadow">
                    <span id="soundIcon">🔕</span>
                    <span id="soundText" class="hidden sm:inline">সতর্কতা বন্ধ</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Header Information: Clock & Date -->
        <section class="text-center space-y-2 pt-2">
            <!-- Large Live Digital Clock -->
            <div id="liveClock" class="text-4xl sm:text-6xl font-black font-mono tracking-wider text-white drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                --:--:-- --
            </div>
            <!-- Bengali Date & Day -->
            <div id="bengaliDate" class="text-xs sm:text-sm text-slate-300 font-medium">
                লোড হচ্ছে...
            </div>
            <!-- Routine Type Status -->
            <div class="inline-block pt-1">
                <span id="routineTypeBadge" class="px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-amber-500/20 text-neonGold border border-amber-500/30 shadow">
                    আজকের রুটিন: লোড হচ্ছে...
                </span>
            </div>
        </section>

        <!-- Current Active Task Highlight Section -->
        <section class="bg-gradient-to-br from-cardBg to-slate-900 border-2 border-emerald-500/60 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden text-center space-y-4">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-[11px] sm:text-xs uppercase tracking-widest text-emerald-400 font-extrabold">চলমান কার্যক্রম (Active Slot)</span>
            </div>

            <h2 id="activeTaskTitle" class="text-xl sm:text-3xl font-extrabold text-neonGold leading-snug">
                অপেক্ষা করুন...
            </h2>
            <p id="activeTaskTime" class="text-xs sm:text-sm text-slate-300 font-mono font-medium"></p>

            <!-- Stop Alarm Button (Only shows when alarm is ringing) -->
            <div class="pt-1">
                <button id="stopAlarmBtn" onclick="stopRingingAlarm()" class="hidden mx-auto bg-red-600 hover:bg-red-500 text-white font-bold text-xs sm:text-sm px-5 py-2 rounded-xl shadow-lg shadow-red-900/50 animate-bounce transition flex items-center gap-2">
                    <span>🔕</span> অ্যালার্ম বন্ধ করুন
                </button>
            </div>
        </section>

        <!-- Routine Schedule List Section -->
        <section class="bg-cardBg border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base sm:text-lg font-bold text-slate-200 flex items-center gap-2">
                    <span>📋</span> <span id="scheduleListTitle">আজকের রুটিন তালিকা</span>
                </h3>
                <span id="totalSlotsCount" class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">লোড হচ্ছে</span>
            </div>

            <!-- Routine Items Container -->
            <div id="routineListContainer" class="space-y-3">
                <!-- Javascript will inject routine cards dynamically here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-cardBg/50 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        নূরের সেরা রুটিন &copy; ২০২৬ | সুশৃঙ্খল জীবনই সফল জীবনের চাবিকাঠি।
    </footer>

    <!-- Audio Element for Continuous Alarm -->
    <audio id="alertSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript Application Logic -->
    <script>
        const weekdayRoutine = [
            { startStr: "০৪:৪৮ AM", endStr: "০৫:৩০ AM", startMin: 4*60 + 48, endMin: 5*60 + 30, title: "ফজর নামাজ ও ওযু 🕋" },
            { startStr: "০৫:৩০ AM", endStr: "০৬:৩০ AM", startMin: 5*60 + 30, endMin: 6*60 + 30, title: "কুরআন মাজিদ ও তাজভিদ / আরবি পড়া 📖" },
            { startStr: "০৭:০০ AM", endStr: "০২:০০ PM", startMin: 7*60, endMin: 14*60, title: "মাদ্রাসার ক্লাস ও পড়া (০১:০০ PM - ০১:৩০ PM যোহর নামাজ) 🕌" },
            { startStr: "০২:০০ PM", endStr: "০৪:১৫ PM", startMin: 14*60, endMin: 16*60 + 15, title: "দুপুরের খাবার, গোসল ও বিশ্রাম 🍛" },
            { startStr: "০৪:১৫ PM", endStr: "০৪:৩০ PM", startMin: 16*60 + 15, endMin: 16*60 + 30, title: "আসর নামাজ 🕋" },
            { startStr: "০৪:৩০ PM", endStr: "০৫:৩০ PM", startMin: 16*60 + 30, endMin: 17*60 + 30, title: "১ম মোবাইল ব্রেক 📱 (১ ঘণ্টা)" },
            { startStr: "০৫:৩০ PM", endStr: "০৫:৪৮ PM", startMin: 17*60 + 30, endMin: 17*60 + 48, title: "বিকেল ব্রেক ও হাঁটাচলা 🍃" },
            { startStr: "০৫:৪৮ PM", endStr: "০৬:১৫ PM", startMin: 17*60 + 48, endMin: 18*60 + 15, title: "মাগরিব নামাজ 🕋" },
            { startStr: "০৬:১৫ PM", endStr: "০৭:১০ PM", startMin: 18*60 + 15, endMin: 19*60 + 10, title: "গণিত ও বিজ্ঞান পড়া 📝" },
            { startStr: "০৭:১০ PM", endStr: "০৭:৫০ PM", startMin: 19*60 + 10, endMin: 19*60 + 50, title: "এশা নামাজ 🕋" },
            { startStr: "০৭:৫০ PM", endStr: "০৮:৩০ PM", startMin: 19*60 + 50, endMin: 20*60 + 30, title: "২য় মোবাইল ব্রেক 📱 (৪০ মিনিট)" },
            { startStr: "০৮:৩০ PM", endStr: "০৯:৪৫ PM", startMin: 20*60 + 30, endMin: 21*60 + 45, title: "বাংলা, ইংরেজি, আকাইদ ও ফিকহ পড়া 📚" },
            { startStr: "০৯:৪৫ PM", endStr: "১০:১৫ PM", startMin: 21*60 + 45, endMin: 22*60 + 15, title: "রাতের খাবার ও পড়া রিভিশন 🍲" },
            { startStr: "১০:১৫ PM", endStr: "১০:৪৫ PM", startMin: 22*60 + 15, endMin: 22*60 + 45, title: "৩য় মোবাইল ব্রেক 📱 (৩০ মিনিট)" },
            { startStr: "১০:৪৫ PM", endStr: "০৪:৪৮ AM", startMin: 22*60 + 45, endMin: 4*60 + 48, title: "জলদি ঘুমিয়ে পড়া 😴" }
        ];

        const weekendRoutine = [
            { startStr: "০৪:৪৮ AM", endStr: "০৫:৩০ AM", startMin: 4*60 + 48, endMin: 5*60 + 30, title: "ফজর নামাজ ও ওযু 🕋" },
            { startStr: "০৫:৩০ AM", endStr: "০৭:০০ AM", startMin: 5*60 + 30, endMin: 7*60, title: "সকালের মিষ্টি ঘুম বা আরাম 😴" },
            { startStr: "০৭:০০ AM", endStr: "০৮:০০ AM", startMin: 7*60, endMin: 8*60, title: "কুরআন মাজিদ ও একটু আরবি রিভিশন 📖" },
            { startStr: "০৮:০০ AM", endStr: "০৯:০০ AM", startMin: 8*60, endMin: 9*60, title: "নাস্তা ও সকালের ১ম মোবাইল ব্রেক 📱" },
            { startStr: "০৯:০০ AM", endStr: "০১:০০ PM", startMin: 9*60, endMin: 13*60, title: "নিজের মতো ফ্রি টাইম (খেলা বা শখ) 🎈" },
            { startStr: "০১:০০ PM", endStr: "০১:৩০ PM", startMin: 13*60, endMin: 13*60 + 30, title: "যোহর নামাজ (শুক্রবারে জুম্মা নামাজ) 🕌" },
            { startStr: "০১:৩০ PM", endStr: "০৪:১৫ PM", startMin: 13*60 + 30, endMin: 16*60 + 15, title: "দুপুরের জমজমাট খাবার ও লম্বা ঘুম 🛌" },
            { startStr: "০৪:১৫ PM", endStr: "০৪:৩০ PM", startMin: 16*60 + 15, endMin: 16*60 + 30, title: "আসর নামাজ 🕋" },
            { startStr: "০৪:৩০ PM", endStr: "০৫:৪৮ PM", startMin: 16*60 + 30, endMin: 17*60 + 48, title: "২য় মহোৎসব মোবাইল ব্রেক 📱 (আনলিমিটেড আনন্দ!)" },
            { startStr: "০৫:৪৮ PM", endStr: "০৬:১৫ PM", startMin: 17*60 + 48, endMin: 18*60 + 15, title: "মাগরিব নামাজ 🕋" },
            { startStr: "০৬:১৫ PM", endStr: "০৭:১০ PM", startMin: 18*60 + 15, endMin: 19*60 + 10, title: "হালকা একটু বই ওড়ানো বা পড়া 📝" },
            { startStr: "০৭:১০ PM", endStr: "০৭:৫০ PM", startMin: 19*60 + 10, endMin: 19*60 + 50, title: "এশা নামাজ 🕋" },
            { startStr: "০৭:৫০ PM", endStr: "০৮:৩০ PM", startMin: 19*60 + 50, endMin: 20*60 + 30, title: "বন্ধুদের সাথে আড্ডা বা রাতের হাঁটাচলা 🤝" },
            { startStr: "০৮:৩০ PM", endStr: "০৯:৪৫ PM", startMin: 20*60 + 30, endMin: 21*60 + 45, title: "আগামী সপ্তাহের একটু পড়া গুছিয়ে রাখা 🎒" },
            { startStr: "০৯:৪৫ PM", endStr: "১০:১৫ PM", startMin: 21*60 + 45, endMin: 22*60 + 15, title: "রাতের খাবার ও ফ্যামিলি আড্ডা 🍲" },
            { startStr: "১০:১৫ PM", endStr: "১১:০০ PM", startMin: 22*60 + 15, endMin: 23*60, title: "৩য় মোবাইল ব্রেক 📱 (ছুটির দিনের বোনাস টাইম)" },
            { startStr: "১১:০০ PM", endStr: "০৪:৪৮ AM", startMin: 23*60, endMin: 4*60 + 48, title: "আরাম করে ঘুমিয়ে পড়া 😴" }
        ];

        let soundEnabled = localStorage.getItem('routine_sound_enabled') === 'true';
        let currentActiveIndex = -1;
        let isAlarmRinging = false;

        function updateSoundUI() {
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (soundEnabled) {
                icon.textContent = "🔔";
                text.textContent = "সতর্কতা চালু";
            } else {
                icon.textContent = "🔕";
                text.textContent = "সতর্কতা বন্ধ";
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('routine_sound_enabled', soundEnabled);
            updateSoundUI();

            const audio = document.getElementById('alertSound');
            if (soundEnabled) {
                audio.play().then(() => {
                    if (!isAlarmRinging) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                }).catch(() => {});
            } else {
                stopRingingAlarm();
            }
        }

        function playAlarmSound() {
            if (!soundEnabled) return;
            const audio = document.getElementById('alertSound');
            audio.currentTime = 0;
            audio.play().then(() => {
                isAlarmRinging = true;
                document.getElementById('stopAlarmBtn').classList.remove('hidden');
            }).catch(e => console.log("Audio autoplay restricted:", e));
        }

        function stopRingingAlarm() {
            const audio = document.getElementById('alertSound');
            audio.pause();
            audio.currentTime = 0;
            isAlarmRinging = false;
            document.getElementById('stopAlarmBtn').classList.add('hidden');
        }

        function updateApplication() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 1. Live Clock
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 || 12;
            const timeStr = `${String(displayHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} ${ampm}`;
            document.getElementById('liveClock').textContent = timeStr;

            // 2. Bengali Date
            const daysBangla = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
            const monthsBangla = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            document.getElementById('bengaliDate').textContent = `${daysBangla[dayOfWeek]}, ${now.getDate()} ${monthsBangla[now.getMonth()]} ${now.getFullYear()}`;

            // 3. Routine Selector
            const isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
            const activeRoutineData = isWeekend ? weekendRoutine : weekdayRoutine;

            const badgeElem = document.getElementById('routineTypeBadge');
            if (isWeekend) {
                badgeElem.textContent = "আজকের রুটিন: ছুটির দিন (আরাম রুটিন)";
                badgeElem.className = "px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30 shadow";
            } else {
                badgeElem.textContent = "আজকের রুটিন: মাদ্রাসার দিন";
                badgeElem.className = "px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-emerald-500/20 text-neonGreen border border-emerald-500/30 shadow";
            }

            // 4. Active Slot Index
            const currentTotalMin = hours * 60 + minutes;
            let activeIndex = -1;

            for (let i = 0; i < activeRoutineData.length; i++) {
                let item = activeRoutineData[i];
                if (item.startMin < item.endMin) {
                    if (currentTotalMin >= item.startMin && currentTotalMin < item.endMin) {
                        activeIndex = i;
                        break;
                    }
                } else {
                    if (currentTotalMin >= item.startMin || currentTotalMin < item.endMin) {
                        activeIndex = i;
                        break;
                    }
                }
            }
            if (activeIndex === -1) activeIndex = 0;

            // Trigger alarm on slot change
            if (currentActiveIndex !== -1 && currentActiveIndex !== activeIndex) {
                playAlarmSound();
            }

            if (currentActiveIndex !== activeIndex) {
                currentActiveIndex = activeIndex;
                renderRoutineList(activeRoutineData, activeIndex);
            }

            // Active Task Header
            const activeItem = activeRoutineData[activeIndex];
            document.getElementById('activeTaskTitle').textContent = activeItem.title;
            document.getElementById('activeTaskTime').textContent = `সময়সূচী: ${activeItem.startStr} - ${activeItem.endStr}`;

            // 5. Countdown Timer
            let endTotalSec = activeItem.endMin * 60;
            if (activeItem.startMin > activeItem.endMin && currentTotalMin < activeItem.endMin) {
                endTotalSec = activeItem.endMin * 60;
            } else if (activeItem.startMin > activeItem.endMin && currentTotalMin >= activeItem.startMin) {
                endTotalSec = (activeItem.endMin + 24 * 60) * 60;
            }

            let currentSecAbsolute = currentTotalMin * 60 + seconds;
            if (activeItem.startMin > activeItem.endMin && currentTotalMin < activeItem.endMin) {
                currentSecAbsolute += 24 * 60 * 60;
            }

            let remSec = endTotalSec - currentSecAbsolute;
            if (remSec < 0) remSec = 0;

            const remHours = Math.floor(remSec / 3600);
            const remMin = Math.floor((remSec % 3600) / 60);
            const remS = remSec % 60;
            
            document.getElementById('cornerCountdown').textContent = `${String(remHours).padStart(2, '0')}:${String(remMin).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;

            updateListStyles(activeRoutineData.length, activeIndex);
        }

        function renderRoutineList(routineData, activeIndex) {
            const container = document.getElementById('routineListContainer');
            container.innerHTML = '';
            document.getElementById('totalSlotsCount').textContent = `মোট ${routineData.length}টি স্লট`;

            routineData.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `routine-card-${index}`;
                card.className = "flex items-center justify-between p-3.5 rounded-2xl border border-slate-800 bg-slate-900/50 transition-all duration-300";
                
                card.innerHTML = `
                    <div class="space-y-1">
                        <h4 id="routine-title-${index}" class="text-sm sm:text-base font-semibold text-slate-200">${item.title}</h4>
                        <p class="text-xs text-slate-400 font-mono">${item.startStr} - ${item.endStr}</p>
                    </div>
                    <div id="routine-badge-${index}" class="text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-slate-800 text-slate-400 border border-slate-700 whitespace-nowrap">
                        অপেক্ষমাণ
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateListStyles(totalSlots, activeIndex) {
            for (let i = 0; i < totalSlots; i++) {
                const card = document.getElementById(`routine-card-${i}`);
                const badge = document.getElementById(`routine-badge-${i}`);
                const titleElem = document.getElementById(`routine-title-${i}`);
                if (!card) continue;

                if (i === activeIndex) {
                    card.className = "flex items-center justify-between p-3.5 rounded-2xl border-2 border-emerald-500 bg-slate-900 shadow-lg shadow-emerald-950/40 transition-all duration-300 scale-[1.01]";
                    badge.className = "text-[11px] px-2.5 py-0.5 rounded-full font-bold bg-emerald-500 text-slate-950 shadow animate-pulse whitespace-nowrap";
                    badge.textContent = "চলমান";
                    titleElem.className = "text-sm sm:text-base font-bold text-neonGold";
                } else if (i < activeIndex || (activeIndex === 0 && i === totalSlots - 1)) {
                    card.className = "flex items-center justify-between p-3.5 rounded-2xl border border-slate-800/80 bg-slate-900/30 opacity-60 transition-all duration-300";
                    badge.className = "text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-slate-800 text-slate-500 border border-slate-700/50 whitespace-nowrap";
                    badge.textContent = "সম্পন্ন";
                    titleElem.className = "text-sm sm:text-base font-medium text-slate-400";
                } else {
                    card.className = "flex items-center justify-between p-3.5 rounded-2xl border border-slate-800 bg-slate-900/50 transition-all duration-300";
                    badge.className = "text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-slate-800 text-slate-400 border border-slate-700 whitespace-nowrap";
                    badge.textContent = "আসছে";
                    titleElem.className = "text-sm sm:text-base font-semibold text-slate-200";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateSoundUI();
            updateApplication();
            setInterval(updateApplication, 1000);
        });
    </script>
</body>
        </html>
